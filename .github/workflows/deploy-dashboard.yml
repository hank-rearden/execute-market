name: Deploy EXECUTE Market Dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'reports/opportunities.json'
      - 'reports/opportunities.csv'
      - 'reports/screening.csv'
      - '.github/workflows/deploy-dashboard.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify saved reports
        run: |
          test -s reports/opportunities.json
          test -s reports/opportunities.csv
          test -s reports/screening.csv
          python - <<'PY'
          import json
          with open("reports/opportunities.json") as f:
              r=json.load(f)
          assert r["paper_only"] is True
          assert len(r["shortlist"]) <= 15
          PY
      - name: Prepare static site
        run: |
          mkdir -p _site/reports
          cp index.html manifest.webmanifest _site/
          cp reports/opportunities.json reports/opportunities.csv reports/screening.csv _site/reports/
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: EXECUTE Market - Stage 4 Historical Archive

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Batch start (YYYY-MM-DD), UDiFF available from 2024-07-08"
        required: true
        default: "2024-10-05"
        type: string
      calendar_days:
        description: "Calendar days in batch (1-180)"
        required: true
        default: "180"
        type: string

permissions:
  contents: write

concurrency:
  group: execute-market-stage4-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch historical NSE UDiFF in bounded batch
        env:
          START_DATE: ${{ inputs.start_date }}
          CALENDAR_DAYS: ${{ inputs.calendar_days }}
        run: python stage4_archive.py --start "$START_DATE" --days "$CALENDAR_DAYS"
      - name: Flag possible corporate action discontinuities
        run: python stage4_audit.py
      - name: Validate research archive
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          status=json.loads(Path("reports/stage4_archive_status.json").read_text())
          audit=json.loads(Path("reports/stage4_corporate_action_audit.json").read_text())
          assert status["archive_sessions"]>0 and status["archive_records"]>=60
          assert not status["corporate_action_adjusted"]
          assert not status["historical_membership_verified"]
          assert not audit["corporate_actions_verified"]
          with Path("data/stage4_udiff_history.csv").open(newline="") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==status["archive_records"]
          assert len({(r["date"],r["symbol"]) for r in rows})==len(rows)
          print("Research archive validated:",status["archive_sessions"],"sessions")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: execute-market-stage4-archive
          path: |
            data/stage4_udiff_history.csv
            reports/stage4_archive_status.json
            reports/stage4_corporate_action_audit.json
          retention-days: 30
      - name: Commit isolated research archive
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stage4_udiff_history.csv reports/stage4_archive_status.json reports/stage4_corporate_action_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Extend Stage 4 research archive and audit"
          git pull --rebase origin main
          git push origin HEAD:main

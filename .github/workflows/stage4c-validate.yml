name: EXECUTE Market - Stage 4C Data Validation
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: execute-market-stage4c
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit point-in-time coverage and historical OHLCV
        run: python stage4c_validate.py
      - name: Discover historical membership candidates and triage large price moves
        run: python stage4c_evidence_discovery.py
      - name: Assert fail-closed research readiness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("reports/stage4c_readiness.json").read_text())
          assert x["backtest_ready"] is False
          assert x["real_money_ready"] is False
          assert x["point_in_time_rows"] <= x["stage4b_conservative_rows"]
          print("Stage 4C audit complete; readiness gates remain closed")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: execute-market-stage4c-audit
          path: |
            reports/stage4c_readiness.json
            reports/stage4c_issues.csv
            reports/stage4c_membership_candidate_audit.json
            reports/stage4c_historical_membership_gaps.csv
            reports/stage4c_price_move_triage.csv
            data/stage4c_point_in_time_history.csv
          retention-days: 30
      - name: Commit audit outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/stage4c_readiness.json reports/stage4c_issues.csv reports/stage4c_membership_candidate_audit.json reports/stage4c_historical_membership_gaps.csv reports/stage4c_price_move_triage.csv data/stage4c_point_in_time_history.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate Stage 4C point-in-time validation report"
          git pull --rebase origin main
          git push origin HEAD:main


name: EXECUTE Market - Nifty 100 History

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-history:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect Nifty 100 historical data
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          import time
          import zipfile
          import urllib.request
          from collections import Counter
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          BASE = "https://nsearchives.nseindia.com"
          TARGET = 250
          LOOKBACK_DAYS = 430

          HEADERS = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "*/*",
              "Referer": "https://www.nseindia.com/"
          }

          def fetch(url, attempts=3):
              last_error = None
              for attempt in range(attempts):
                  try:
                      request = urllib.request.Request(
                          url, headers=HEADERS
                      )
                      with urllib.request.urlopen(
                          request, timeout=20
                      ) as response:
                          return response.read()
                  except Exception as exc:
                      last_error = exc
                      if attempt + 1 < attempts:
                          time.sleep(attempt + 1)
              raise RuntimeError(str(last_error))

          def read_csv(raw):
              return csv.DictReader(
                  io.StringIO(raw.decode("utf-8-sig"))
              )

          Path("data").mkdir(exist_ok=True)

          output = Path("data/nifty100_history.csv")
          report_path = Path(
              "data/history100_report.json"
          )

          fields = [
              "date", "symbol", "open", "high",
              "low", "close", "volume"
          ]

          universe_urls = [
              BASE + "/content/indices/ind_nifty100list.csv",
              "https://www.niftyindices.com/IndexConstituent/ind_nifty100list.csv"
          ]

          symbols = None
          source_url = None

          for url in universe_urls:
              try:
                  reader = read_csv(fetch(url))
                  if "Symbol" not in (
                      reader.fieldnames or []
                  ):
                      continue

                  values = [
                      row["Symbol"].strip()
                      for row in reader
                      if row.get("Symbol", "").strip()
                  ]

                  if (
                      len(values) == 100
                      and len(set(values)) == 100
                  ):
                      symbols = values
                      source_url = url
                      break
              except Exception as exc:
                  print(
                      "Universe source failed:",
                      str(exc), flush=True
                  )

          if symbols is None:
              raise SystemExit(
                  "FAILED: Cannot validate Nifty 100 universe"
              )

          wanted = set(symbols)
          records = {}
          sessions = set()
          failures = []
          coverage_warnings = []

          print(
              "Validated universe:", len(symbols),
              flush=True
          )

          # Reuse compatible existing data.
          if output.exists():
              with output.open(
                  newline="", encoding="utf-8"
              ) as file:
                  reader = csv.DictReader(file)

                  if not set(fields).issubset(
                      reader.fieldnames or []
                  ):
                      raise SystemExit(
                          "FAILED: Existing history format invalid"
                      )

                  for row in reader:
                      if row["symbol"] not in wanted:
                          continue

                      try:
                          values = [
                              float(row[k])
                              for k in (
                                  "open", "high",
                                  "low", "close"
                              )
                          ]
                          volume = int(float(row["volume"]))
                          datetime.strptime(
                              row["date"], "%Y-%m-%d"
                          )
                          if (
                              min(values) <= 0
                              or volume < 0
                          ):
                              continue
                      except (ValueError, KeyError):
                          continue

                      key = (
                          row["date"], row["symbol"]
                      )
                      records[key] = {
                          k: row[k] for k in fields
                      }

              counts = Counter(
                  date for date, symbol in records
              )

              sessions = {
                  date for date, count in counts.items()
                  if count >= 60
              }

              print(
                  "Reused sessions:", len(sessions),
                  flush=True
              )

          today = datetime.now(
              timezone.utc
          ).date()

          for offset in range(1, LOOKBACK_DAYS + 1):
              if len(sessions) >= TARGET:
                  break

              day = today - timedelta(days=offset)

              if day.weekday() >= 5:
                  continue

              date = day.isoformat()

              if date in sessions:
                  continue

              stamp = day.strftime("%Y%m%d")

              url = (
                  BASE + "/content/cm/"
                  "BhavCopy_NSE_CM_0_0_0_"
                  + stamp + "_F_0000.csv.zip"
              )

              try:
                  raw = fetch(url)

                  with zipfile.ZipFile(
                      io.BytesIO(raw)
                  ) as archive:
                      names = [
                          name
                          for name in archive.namelist()
                          if name.lower().endswith(".csv")
                      ]

                      if len(names) != 1:
                          raise ValueError(
                              "Expected one CSV inside ZIP"
                          )

                      content = archive.read(names[0])

                  reader = read_csv(content)

                  required = {
                      "Sgmt", "FinInstrmTp",
                      "TckrSymb", "OpnPric",
                      "HghPric", "LwPric",
                      "ClsPric", "TtlTradgVol"
                  }

                  if not required.issubset(
                      reader.fieldnames or []
                  ):
                      raise ValueError(
                          "Unexpected UDiFF columns"
                      )

                  daily = {}

                  for row in reader:
                      symbol = row["TckrSymb"].strip()

                      if symbol not in wanted:
                          continue

                      if row["Sgmt"].strip() != "CM":
                          continue

                      if row["FinInstrmTp"].strip() != "STK":
                          continue

                      try:
                          op = float(row["OpnPric"])
                          hi = float(row["HghPric"])
                          lo = float(row["LwPric"])
                          cl = float(row["ClsPric"])
                          vol = int(
                              float(row["TtlTradgVol"])
                          )
                      except (ValueError, TypeError):
                          continue

                      if not (
                          lo > 0
                          and lo <= op <= hi
                          and lo <= cl <= hi
                          and vol >= 0
                      ):
                          continue

                      if symbol in daily:
                          raise ValueError(
                              "Duplicate symbol: " + symbol
                          )

                      daily[symbol] = {
                          "date": date,
                          "symbol": symbol,
                          "open": op,
                          "high": hi,
                          "low": lo,
                          "close": cl,
                          "volume": vol
                      }

                  if len(daily) < 60:
                      raise ValueError(
                          "Insufficient coverage: "
                          + str(len(daily))
                      )

                  if len(daily) < 80:
                      coverage_warnings.append({
                          "date": date,
                          "symbols": len(daily)
                      })

                  for symbol, row in daily.items():
                      records[(date, symbol)] = row

                  sessions.add(date)

                  print(
                      "OK:", date,
                      "symbols:", len(daily),
                      "sessions:", len(sessions),
                      flush=True
                  )

              except Exception as exc:
                  failures.append({
                      "date": date,
                      "reason": str(exc)
                  })

                  print(
                      "SKIP:", date,
                      str(exc), flush=True
                  )

              time.sleep(0.15)

          selected = sorted(
              sessions, reverse=True
          )[:TARGET]

          selected_set = set(selected)

          rows = [
              row
              for (date, symbol), row
              in records.items()
              if date in selected_set
          ]

          rows.sort(
              key=lambda row: (
                  row["date"], row["symbol"]
              )
          )

          with output.open(
              "w", newline="", encoding="utf-8"
          ) as file:
              writer = csv.DictWriter(
                  file, fieldnames=fields
              )
              writer.writeheader()
              writer.writerows(rows)

          counts = Counter(
              row["symbol"] for row in rows
          )

          missing = [
              symbol for symbol in symbols
              if counts[symbol] < 200
          ]

          report = {
              "generated_utc": datetime.now(
                  timezone.utc
              ).isoformat(),
              "universe_source": source_url,
              "universe_size": len(symbols),
              "target_sessions": TARGET,
              "sessions": len(selected),
              "records": len(rows),
              "latest_date": (
                  selected[0] if selected else None
              ),
              "earliest_date": (
                  selected[-1] if selected else None
              ),
              "symbols_below_200_sessions": missing,
              "coverage_warnings": coverage_warnings,
              "failed_dates": failures,
              "corporate_action_adjusted": False,
              "paper_trading_only": True
          }

          report_path.write_text(
              json.dumps(report, indent=2),
              encoding="utf-8"
          )

          print(
              json.dumps(report, indent=2),
              flush=True
          )

          if len(selected) < TARGET:
              raise SystemExit(
                  "FAILED: Collected "
                  + str(len(selected))
                  + " of 250 sessions"
              )

          if missing:
              print(
                  "WARNING: Some current constituents "
                  "have fewer than 200 sessions."
              )

          print(
              "HISTORY COLLECTION PASSED",
              flush=True
          )
          PY

      - name: Upload historical data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execute-nifty100-history
          path: |
            data/nifty100_history.csv
            data/history100_report.json
          if-no-files-found: warn
          retention-days: 30
 

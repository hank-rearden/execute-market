name: EXECUTE Market - Stage 3 Paper Execution Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Simulate risk-limited paper trades
        run: python backtest_stage3.py
      - name: Validate simulation and reports
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path("reports")
          r=json.loads((p/"backtest_stage3.json").read_text())
          assert r["paper_only"] and r["sessions"]>=210
          assert set(r["strategies"])=={"baseline","enhanced"}
          for m in ("baseline","enhanced"):
              s=r["strategies"][m]
              assert s["starting_capital"]==50000
              assert s["ending_marked_equity"]>=0
              assert s["closed_trades"]>=0
          with (p/"backtest_stage3_equity.csv").open(newline="") as f:
              assert sum(1 for _ in csv.DictReader(f))>=420
          print("Stage 3 validation passed; zero trades is permitted and must be reported honestly")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: execute-market-stage3-paper-backtest
          path: |
            reports/backtest_stage3.json
            reports/backtest_stage3_trades.csv
            reports/backtest_stage3_equity.csv
          retention-days: 30
      - name: Publish validated paper results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/backtest_stage3.json reports/backtest_stage3_trades.csv reports/backtest_stage3_equity.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Stage 3 paper trade simulation results"
          git pull --rebase origin main
          git push origin HEAD:main

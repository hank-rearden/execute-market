
name: EXECUTE Market - Technical Screener

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screen-stocks:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run technical screener
        run: python screener.py

      - name: Rank paper-trading opportunities
        run: python rank_opportunities.py

      - name: Upload screening reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execute-market-screening
          path: |
            reports/screening.csv
            reports/screening.json
            reports/opportunities.csv
            reports/opportunities.json
          if-no-files-found: error
          retention-days: 30

      - name: Save validated screening reports to repository
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          report = json.loads(Path("reports/screening.json").read_text(encoding="utf-8"))
          results = report.get("results")
          if not report.get("paper_only") or not isinstance(results, list) or len(results) != 100:
              raise SystemExit("Refusing to commit: expected 100 paper-only screening results")
          if len({row["symbol"] for row in results}) != 100:
              raise SystemExit("Refusing to commit: duplicate symbols")
          with Path("reports/screening.csv").open(newline="", encoding="utf-8") as file:
              csv_rows = list(csv.DictReader(file))
          if len(csv_rows) != 100:
              raise SystemExit("Refusing to commit: CSV does not have 100 rows")
          print("Validated 100 paper-trading screening results")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/screening.csv reports/screening.json reports/opportunities.csv reports/opportunities.json
          if git diff --cached --quiet; then
            echo "Screening reports unchanged; no commit necessary."
            exit 0
          fi
          git commit -m "Update Nifty 100 paper-trading screening reports"
          git pull --rebase origin main
          git push origin HEAD:main

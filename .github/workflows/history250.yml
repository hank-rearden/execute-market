name: EXECUTE Market - Historical Data 250

on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * 1-5'

permissions:
  contents: write

concurrency:
  group: execute-market-history
  cancel-in-progress: false

jobs:
  collect-history:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Collect and validate NSE data
        shell: bash
        run: |
          python - <<'PYCODE'
          import csv
          import io
          import os
          import time
          import zipfile
          import urllib.error
          import urllib.request
          from collections import Counter
          from datetime import date, datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          SYMBOLS = ('DLF', 'HDFCLIFE', 'TMCV')
          SERIES = {'DLF': {'EQ'}, 'HDFCLIFE': {'EQ'},
                    'TMCV': {'BE', 'EQ'}}
          FIRST_DATE = {'TMCV': date(2025, 11, 12)}
          TARGET = 250
          LOOKBACK_DAYS = 440
          FILE = Path('data/nse_history.csv')
          URL = ('https://nsearchives.nseindia.com/content/cm/'
                 'BhavCopy_NSE_CM_0_0_0_{}_F_0000.csv.zip')
          HEADERS = {'User-Agent': 'Mozilla/5.0', 'Accept': '*/*',
                     'Referer': 'https://www.nseindia.com/'}
          FIELDS = ['date', 'symbol', 'series', 'open', 'high',
                    'low', 'close', 'volume']
          NEEDED = {'TckrSymb', 'SctySrs', 'OpnPric', 'HghPric',
                    'LwPric', 'ClsPric', 'TtlTradgVol'}

          def validate(row):
              day = date.fromisoformat(row['date'])
              symbol = row['symbol'].strip()
              series = row['series'].strip()
              if symbol not in SYMBOLS or series not in SERIES[symbol]:
                  raise ValueError('Unexpected symbol/series: ' + str(row))
              if symbol in FIRST_DATE and day < FIRST_DATE[symbol]:
                  raise ValueError('Pre-listing TMCV record: ' + str(row))
              o, h, l, c = [float(row[k]) for k in
                            ('open', 'high', 'low', 'close')]
              v = int(row['volume'])
              if not (0 < l <= min(o, c) <= max(o, c) <= h and v >= 0):
                  raise ValueError('Invalid OHLCV: ' + str(row))
              return dict(date=day.isoformat(), symbol=symbol,
                          series=series, open=o, high=h, low=l,
                          close=c, volume=v)

          existing = {}
          if FILE.exists():
              with FILE.open(newline='', encoding='utf-8') as f:
                  for r in csv.DictReader(f):
                      # Old-format history may lack a series column.
                      if r['symbol'] not in SYMBOLS:
                          continue
                      if not r.get('series'):
                          r['series'] = 'EQ'
                      v = validate(r)
                      key = (v['date'], v['symbol'])
                      if key in existing:
                          raise ValueError('Duplicate existing record: ' + str(key))
                      existing[key] = v
          print('Previously saved records:', len(existing), flush=True)

          now = datetime.now(ZoneInfo('Asia/Kolkata'))
          last = now.date() if now.hour >= 19 else now.date() - timedelta(days=1)
          # Avoid downloading dates earlier than TMCV's first listing.
          earliest = last - timedelta(days=LOOKBACK_DAYS - 1)
          downloaded_dates = 0
          missing_files = 0

          def counts():
              return Counter(symbol for _, symbol in existing)

          for age in range(LOOKBACK_DAYS):
              day = last - timedelta(days=age)
              if day < earliest:
                  break
              if day.weekday() >= 5:
                  continue  # Exceptional weekend sessions need separate review.
              ds = day.isoformat()
              needed = [s for s in SYMBOLS
                        if counts()[s] < TARGET
                        and day >= FIRST_DATE.get(s, date.min)
                        and (ds, s) not in existing]
              if not needed:
                  continue

              url = URL.format(day.strftime('%Y%m%d'))
              try:
                  request = urllib.request.Request(url, headers=HEADERS)
                  with urllib.request.urlopen(request, timeout=20) as response:
                      raw = response.read()
                  with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                      names = [n for n in archive.namelist()
                               if n.lower().endswith('.csv')]
                      if len(names) != 1:
                          raise ValueError('Expected one CSV on ' + ds)
                      with archive.open(names[0]) as stream:
                          reader = csv.DictReader(io.TextIOWrapper(
                              stream, encoding='utf-8-sig'))
                          missing = NEEDED - set(reader.fieldnames or [])
                          if missing:
                              raise ValueError('Missing columns on ' + ds
                                               + ': ' + str(missing))
                          matches = [r for r in reader
                                     if r['TckrSymb'].strip() in needed
                                     and r['SctySrs'].strip() in
                                     SERIES[r['TckrSymb'].strip()]]
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      missing_files += 1
                      print('No published bhavcopy:', ds, flush=True)
                      continue
                  raise

              grouped = {}
              for r in matches:
                  symbol = r['TckrSymb'].strip()
                  grouped.setdefault(symbol, []).append(r)
              for symbol in needed:
                  rows = grouped.get(symbol, [])
                  if len(rows) > 1:
                      raise ValueError('Duplicate series records: '
                                       + symbol + ' ' + ds)
                  if not rows:
                      print('Missing symbol:', symbol, ds, flush=True)
                      continue
                  r = rows[0]
                  record = dict(date=ds, symbol=symbol,
                                series=r['SctySrs'].strip(),
                                open=r['OpnPric'], high=r['HghPric'],
                                low=r['LwPric'], close=r['ClsPric'],
                                volume=r['TtlTradgVol'])
                  existing[(ds, symbol)] = validate(record)
              downloaded_dates += 1
              if downloaded_dates % 20 == 0:
                  print('Downloaded dates:', downloaded_dates,
                        'per-stock counts:', dict(counts()), flush=True)
              if all(counts()[s] >= TARGET for s in SYMBOLS):
                  break
              time.sleep(0.15)

          by_symbol = {}
          for symbol in SYMBOLS:
              records = sorted((r for r in existing.values()
                                if r['symbol'] == symbol),
                               key=lambda r: r['date'])[-TARGET:]
              by_symbol[symbol] = records
              if not records:
                  raise SystemExit('FAIL: no records for ' + symbol)
              print(symbol, 'sessions:', len(records),
                    'range:', records[0]['date'], records[-1]['date'],
                    'EMA200 ready:', len(records) >= 200, flush=True)

          # Mature symbols must have full history; TMCV can be shorter.
          for symbol in ('DLF', 'HDFCLIFE'):
              if len(by_symbol[symbol]) < TARGET:
                  raise SystemExit('FAIL: insufficient history for ' + symbol)

          output = sorted((r for rows in by_symbol.values() for r in rows),
                          key=lambda r: (r['date'], r['symbol']))
          FILE.parent.mkdir(parents=True, exist_ok=True)
          tmp = FILE.with_suffix('.tmp')
          with tmp.open('w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=FIELDS)
              writer.writeheader()
              writer.writerows(output)
          os.replace(tmp, FILE)
          print('PASS: saved', len(output), 'rows',
                'missing bhavcopies:', missing_files, flush=True)
          print('NOTE: Prices are unadjusted for corporate actions;'
                ' indicators and backtests need adjustment checks.')
          PYCODE

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: nse-history-250
          path: data/nse_history.csv
          if-no-files-found: error
          retention-days: 7

      - name: Commit updated history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nse_history.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update NSE historical data"
            git push
          else
            echo "No data changes"
          fi

name: EXECUTE Market - Stage 2 Fair Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare-matched:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run matched-count matched-date benchmark study
        run: python backtest_stage2.py
      - name: Validate outputs
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path("reports")
          j=json.loads((p/"backtest_stage2.json").read_text())
          assert j["paper_only"]
          assert all(j["summary"][str(h)]["matched_dates"]>0 for h in (5,10))
          with (p/"backtest_stage2_cohorts.csv").open(newline="") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)>0
          assert all(int(r["matched_count"])>=1 for r in rows)
          print("Stage 2 matched-cohort validation passed")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: execute-market-stage2-backtest
          path: |
            reports/backtest_stage2.json
            reports/backtest_stage2_cohorts.csv
            reports/backtest_stage2_observations.csv
          retention-days: 30
      - name: Commit validated results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/backtest_stage2.json reports/backtest_stage2_cohorts.csv reports/backtest_stage2_observations.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish matched Stage 2 ranking comparison"
          git pull --rebase origin main
          git push origin HEAD:main
